# Мутационное тестирование (§15.7).
# Порог задаётся по КАЖДОМУ критичному модулю, а не общий по проекту:
# общий порог позволяет спрятать непокрытый модуль за хорошо покрытыми.

timeout_multiplier = 5.0
minimum_test_timeout = 30

exclude_globs = [
    "crates/iaam-bootstrap/**",
]

# Исключения только для точек сборки. Доменные модули исключать ЗАПРЕЩЕНО:
# исключение модуля из мутационного тестирования — способ спрятать
# подложные тесты, а не способ ускорить сборку.

# Заслон trybuild из мутационного прогона исключён по времени, а не по
# существу. `tests/ui.rs` компилирует четыре случая, которые ОБЯЗАНЫ не
# собираться, и это занимает одиннадцать секунд. На каждого из примерно
# пятисот мутантов это добавляет полтора часа — при таймауте mutants.yml
# в шестьдесят минут прогон становится невозможен.
#
# Пропуск ничего не скрывает: мутант библиотечного кода не может изменить
# исход compile_fail иначе как сломав сборку крейты, а такой мутант
# нежизнеспособен по построению и в счёт выживших не идёт. Заслон
# trybuild продолжает работать в обычном прогоне тестов.
#
# Это исключение ТЕСТА, а не модуля. Исключать доменные модули запрещено
# (см. exclude_globs выше).
additional_cargo_test_args = ["--", "--skip", "errors_that_must_not_compile"]

# Мутанты, возвращающие ошибку из функций с Result (§15.7).
# Без них путь обработки ошибок не мутируется вовсе: cargo-mutants
# по умолчанию подставляет только Ok(Default::default()), поэтому
# ветка «а что если операция не удалась» остаётся непроверенной.
#
# Значения заданы НЕ здесь, а в scripts/check-mutants.sh флагом --error,
# и только для пакета iaam-core. Причина — цена, а не ослабление:
# `crate::numeric::NumericError::Overflow` и `crate::money::MoneyError`
# существуют только в iaam-core, поэтому в любом другом пакете такой
# мутант не компилируется НИКОГДА. Он всё равно оплачивается полной
# сборкой, чтобы выясниться нежизнеспособным.
#
# Замер по отчётам прогона: в iaam-store нежизнеспособны все 70 из 70
# мутантов с этими значениями — ровно половина мутантов пакета. В самом
# iaam-core из 206 таких мутантов 31 убит тестами, и там они остаются.
# Убирается заведомо мёртвая работа, а не проверка.
