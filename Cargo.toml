[workspace]
resolver = "2"
members = ["crates/iaam-http", "crates/iaam-core", "crates/iaam-market", "crates/iaam-oracle", "crates/iaam-store", "crates/iaam-ingest", "crates/iaam-broker", "crates/iaam-app", "crates/iaam-server", "crates/iaam-bootstrap"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Профиль мутационного прогона. Отличается от `dev` ровно одним:
# отладочная информация урезана до таблиц строк.
#
# Причина в цене. Каждый мутант — это отдельная сборка и линковка всех
# тестовых целей пакета, а при `debug = 2` тестовый бинарник тащит
# отладочную информацию всего графа зависимостей: замер на contract даёт
# 228 МБ, из которых после strip-debug остаётся 60 МБ. Три четверти
# объёма линкуются заново на каждого из примерно двух тысяч мутантов.
#
# `line-tables-only` оставляет файл и строку в сообщении паники — то
# есть всё, чем мутационный прогон пользуется. Пропадает только
# просмотр значений переменных в отладчике, которого здесь нет.
#
# Профиль назван `mutant`, а не `mutants`: cargo кладёт сборку
# в target/<профиль>, а target/mutants занят отчётами прогона
# (их выгружает CI как артефакт).
[profile.mutant]
inherits = "dev"
debug = "line-tables-only"
