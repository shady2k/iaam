[package]
name = "iaam-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
iaam-core = { path = "../iaam-core", version = "0.1.0" }
iaam-http = { path = "../iaam-http", version = "0.1.0" }
iaam-market = { path = "../iaam-market", version = "0.1.0" }
iaam-store = { path = "../iaam-store", version = "0.1.0" }
iaam-ingest = { path = "../iaam-ingest", version = "0.1.0" }
# Шифрование брокерского доступа: адаптер хранилища держит шифротекст
# непрозрачными байтами, а ключ и сам шифр живут здесь.
iaam-broker = { path = "../iaam-broker", version = "0.1.0" }
serde_json = "1"
# Один и только один механизм асинхронных трейтов (§3.2). Выбран async-trait:
# порты обязаны быть объектобезопасными (`Arc<dyn Store>`), а RPITIT
# объектобезопасности не даёт. Смешение механизмов запрещено заслоном.
async-trait = "0.1"
# Выпуск токена живёт в адаптере хранилища (порт `TokenAdmin`), и потому
# криптографический источник случайности и SHA-256 нужны здесь: вторая
# копия этой пары в транспорте разошлась бы с первой молча.
rand = { version = "0.10", features = ["sys_rng"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
time = { version = "0.3", default-features = false, features = ["std", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
# Брокерский токен живёт открытым ровно до шифрования и зануляется.
zeroize = { version = "1", features = ["alloc"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[lints]
workspace = true