[package]
name = "iaam-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# ChaCha20-Poly1305: чистый Rust без C-зависимостей и с проверкой
# подлинности — подделанный шифротекст обязан быть отказом, а не
# расшифровкой в мусор.
chacha20poly1305 = "0.11"
# Ключ приходит из окружения в base64: сырые 32 байта в переменной
# окружения не переживают ни один копипаст.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Расшифрованный токен зануляется при уничтожении: копия секрета,
# оставшаяся в освобождённой памяти, — это тот же секрет.
zeroize = { version = "1", features = ["alloc"] }
thiserror = "2"
# HTTP-клиент шлюза брокера. rustls без встроенных корней: клиент
# доверяет ровно тому, что ему дали, и ничему больше.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Живая проверка на песочнице брокера. Выключена по умолчанию: обычный
# прогон тестов сети не касается вовсе. Не включайте её через
# `--all-features` — это превратит любой прогон в поход в интернет.
sandbox = []

[dev-dependencies]
# Отпечаток вшитого корня доверия проверяется тестом.
sha2 = "0.11"
# Для примера живой проверки и для тестов режима песочницы.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Режим песочницы берёт заведённый доступ из базы, а не из переменной
# окружения: проверяется тот же путь, которым ходит боевой код.
iaam-store = { path = "../iaam-store", version = "0.1.0" }

[lints]
workspace = true
