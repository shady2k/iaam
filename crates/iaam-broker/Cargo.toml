[package]
name = "iaam-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# ChaCha20-Poly1305: чистый Rust без C-зависимостей и с проверкой
# подлинности — подделанный шифротекст обязан быть отказом, а не
# расшифровкой в мусор.
chacha20poly1305 = "0.11"
# Ключ приходит из окружения в base64: сырые 32 байта в переменной
# окружения не переживают ни один копипаст.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Расшифрованный токен зануляется при уничтожении: копия секрета,
# оставшаяся в освобождённой памяти, — это тот же секрет.
zeroize = { version = "1", features = ["alloc"] }
thiserror = "2"

[lints]
workspace = true
