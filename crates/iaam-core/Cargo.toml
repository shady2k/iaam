[package]
name = "iaam-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# 256-битная целая арифметика для точного сравнения рациональных чисел.
ethnum = "1"
# Календарь. Выбран вместо chrono: меньше поверхность, нет зависимости
# на локальную таймзону по умолчанию. Даты в системе — календарные (`Date`),
# а не моменты времени: операция происходит в дату, а не в момент.
time = { version = "0.3", default-features = false, features = ["std", "macros", "serde", "parsing", "formatting"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Каноническая сериализация состояния для отпечатка. CBOR, потому что
# карты состояния имеют составные ключи: JSON их не берёт.
ciborium = "0.2"
sha2 = "0.11"

[lints]
workspace = true

[dev-dependencies]
# `rust_decimal` и `time` уже в [dependencies] крейты, поэтому интеграционным
# тестам в tests/ доступны без отдельного объявления. Нужен только proptest.
proptest = "1"
# Чтение замороженного корпуса эталонных ставок (tests/fixtures/xirr_cases.json).
serde_json = "1"
