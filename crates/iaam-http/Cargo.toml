[package]
name = "iaam-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Единственное место в дереве, где объявлен HTTP-клиент. rustls без
# встроенных корней там, где якорь задан явно; веб-корни там, где узел
# публичный. Выбор делает таблица назначений, а не клиент.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
# Экранирование значений строки запроса. Своя реализация процентного
# кодирования — лишнее место для ошибки в том, что уже решено.
percent-encoding = "2"
# Секрет зануляется при уничтожении: копия токена, оставшаяся
# в освобождённой памяти, — это тот же токен.
zeroize = { version = "1", features = ["alloc"] }
# A `Retry-After` may name an HTTP-date rather than seconds, and the gateway
# obeys whichever form the source sends. RFC 9110's three date formats are a
# parser of their own; this one is already in the tree beneath hyper.
httpdate = "1"
# The gateway's production timer and its per-destination async lock. The
# application already runs tokio; the gateway only borrows its timer.
tokio = { version = "1", features = ["sync", "time"] }
# Waits, retries, refusals and breaker changes as structured events: an
# operator watching a slow synchronisation must tell a budget wait from an
# open breaker. The same facade the rest of the tree logs through.
tracing = "0.1"

[dev-dependencies]
# `test-util` pauses the tokio timer, so the production sleeper is checked
# without a real wait.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
sha2 = "0.11"
# Captures the gateway's events in a test, to prove what they carry.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
