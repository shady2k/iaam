[package]
name = "iaam-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Никаких зависимостей на iaam-core в основной сборке:
# эталон не должен делить с продакшеном ничего, кроме примитивов.

[dev-dependencies]
# Версия указана рядом с путём намеренно: `cargo deny` считает path-зависимость
# без версии wildcard-зависимостью, а wildcards = "deny" в deny.toml.
iaam-core = { path = "../iaam-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Нужны тесту соответствия: он строит входные данные в типах ядра.
rust_decimal = { version = "1", default-features = false, features = ["std"] }
time = { version = "0.3", default-features = false, features = ["std", "macros"] }

[lints]
workspace = true
