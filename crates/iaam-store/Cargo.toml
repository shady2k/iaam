[package]
name = "iaam-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Версия рядом с путём обязательна: `cargo deny` считает path-зависимость
# без версии wildcard-зависимостью, а wildcards = "deny" в deny.toml.
iaam-core = { path = "../iaam-core", version = "0.1.0" }
# `trace` is needed only by `journal::read`'s statement-counting test
# (`Connection::trace_v2`), but rusqlite features are resolved once per
# build graph, so it is declared on the main dependency rather than
# duplicated under `[dev-dependencies]`.
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Снимок проекции содержит карты с составными ключами, которые JSON
# представить не может («key must be a string»). CBOR может.
ciborium = "0.2"
# Контрольная сумма бандла по всему содержимому, а не по идентификаторам.
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "macros", "parsing", "formatting"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# Только для тестов: хранилище держит шифротекст непрозрачным и о
# криптографии соседнего адаптера ничего не знает. Тесту же нужно
# зашифровать настоящий токен, чтобы искать его в байтах файла базы.
iaam-broker = { path = "../iaam-broker", version = "0.1.0" }

[lints]
workspace = true